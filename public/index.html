<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>知藏 · 你的收藏，是一座没打开的宝藏</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/landing.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%239a5f2c'/%3E%3Ctext x='16' y='22' font-size='17' fill='white' text-anchor='middle' font-family='sans-serif'%3E藏%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="lp-topbar">
  <div class="lp-brand">
    <span class="lp-logo">知藏</span>
    <span class="lp-slogan">知乎收藏，重见天日。</span>
  </div>
  <nav class="lp-nav">
    <a href="/privacy.html">隐私说明</a>
    <span class="lp-mark">藏</span>
  </nav>
</header>

<main>
  <section class="lp-hero">
    <div class="lp-hero-text">
      <div class="lp-hero-eyebrow">知 · 藏</div>
      <h1>你的收藏，<br>是一座<span class="accent">没打开的宝藏</span>。</h1>

      <p class="lp-hero-desc"><strong>知</strong>是知乎，也是「知道」；<strong>藏</strong>是收藏，也是「宝藏」。那些顺手收下、再也没点开的内容，不是垃圾，是被埋起来的宝藏。知藏帮你把它挖开、理清，再告诉你今天该读哪一篇。</p>

      <div class="lp-cta">
        <a class="lp-btn primary" href="/auth/zhihu/start?return_to=%2Fapp">
          用知乎账号登录，打开我的宝藏 →
        </a>
      </div>

      <div class="lp-hero-fine">
        <div>全程只读，不会改动你的账号</div>
        <div>报告只在内存里生成，不写数据库</div>
      </div>
    </div>

    <div class="lp-hero-art">
      <img src="/assets/hero-treasure.png" alt="知藏 · 宝藏主视觉">
    </div>
  </section>

  <section class="lp-steps">
    <a class="lp-step" href="/app?screen=1">
      <div class="lp-step-no"><span class="dot">01</span> <span class="arrow">→</span></div>
      <h3>地层剖面</h3>
      <p>按季度剖开你的收藏，看清这些年在关心什么、什么时候断了。</p>
    </a>
    <a class="lp-step" href="/app?screen=2">
      <div class="lp-step-no"><span class="dot">02</span> <span class="arrow">→</span></div>
      <h3>体检报告</h3>
      <p>六个数字：躺了多久、多少是刷到顺手收的、哪些该删。</p>
    </a>
    <a class="lp-step last" href="/app?screen=3">
      <div class="lp-step-no"><span class="dot">03</span> <span class="arrow">→</span></div>
      <h3>今天读这篇</h3>
      <p>只推一篇，并用你自己的数据说清凭什么是它。</p>
    </a>
  </section>
</main>

</body>
</html>
