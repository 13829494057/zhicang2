<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>收藏夹考古</title>
<link rel="stylesheet" href="/style.css">
<link rel="stylesheet" href="/screens.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230066ff'/%3E%3Ctext x='16' y='22' font-size='18' fill='white' text-anchor='middle' font-family='sans-serif'%3E考%3C/text%3E%3C/svg%3E">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark" style="background:linear-gradient(150deg,#b5793f,#8a5a2b)">藏</span>
    知藏
  </a>
  <div class="user-area" id="userArea"></div>
</header>

<main class="wrap">

  <!-- ══ 屏零 A · 未登录落地 ══ -->
  <section id="guest" hidden>
    <div class="card hero">
      <h1>给你的收藏夹做一次考古</h1>
      <p>然后只推一篇今天该读的，并说出为什么是它。</p>

      <div class="privacy">
        <ul>
          <li>只读你的<strong>收藏夹内容</strong>（含私密夹）、关注与创作，不读私信、不读浏览记录</li>
          <li><strong>不写数据库</strong>，报告在内存里算完就发给你</li>
          <li>会话 <strong>1 小时</strong>后自动清除，或点「退出」立即清</li>
          <li>不会在你的账号下发布、点赞、关注任何内容</li>
          <li>你可以随时在知乎的第三方授权管理里撤销</li>
        </ul>
      </div>

      <a class="btn" id="loginBtn" href="/auth/zhihu/start">用知乎账号登录</a>
    </div>

    <div class="footer">
      <a href="/privacy.html">隐私说明</a>·
      <a href="https://www.zhihu.com/settings/account" target="_blank" rel="noopener">撤销授权</a>
      <div class="fine">知乎黑客松 2026 校园新锐季 · 基于知乎开放平台构建</div>
    </div>
  </section>

  <!-- ══ 屏零 B · 扫描中 ══ -->
  <section id="scanning" hidden>
    <div class="card scanning">
      <div class="scan-count" id="scanCount">0</div>
      <div class="scan-label" id="scanLabel">正在读取你的收藏夹…</div>
      <div class="progress"><i></i></div>
    </div>
  </section>

  <!-- ══ 三屏主体 ══ -->
  <section id="report" hidden>
    <div class="screens">
      <button class="screen-dot" data-screen="1">屏一 · 地层剖面</button>
      <button class="screen-dot" data-screen="2">屏二 · 体检报告</button>
      <button class="screen-dot active" data-screen="3">屏三 · 今天读这篇</button>
    </div>

    <!-- 屏一 -->
    <div id="screen1" hidden>
      <div class="strata-wrap">
        <div style="font-size:15px;font-weight:700">我这几年在关心什么，什么时候断了</div>
        <div style="font-size:13px;color:var(--muted);margin-top:5px" id="strataMode"></div>
        <div class="strata-plot">
          <div class="strata-yaxis" id="strataY"></div>
          <div class="strata-scroll">
            <div class="strata-chart" id="strataChart"></div>
          </div>
        </div>
        <div class="strata-x" id="strataX"></div>
        <div class="legend" id="strataLegend"></div>
        <div id="faultBox"></div>
      </div>

      <div class="summary-wrap">
        <div class="summary-head">
          <div style="font-size:15px;font-weight:700">你看过的内容分布</div>
          <div style="font-size:13px;color:var(--muted);margin-top:4px" id="summaryLead"></div>
        </div>
        <div class="summary-list" id="summaryList"></div>
      </div>
    </div>

    <!-- 屏二 -->
    <div id="screen2" hidden>
      <div class="cards6" id="cards6"></div>
      <div id="driftBox"></div>
    </div>

    <!-- 屏三 -->
    <div id="screen3">
      <div id="todayBox"></div>
    </div>

    <div class="coverage-note" id="coverage"></div>
  </section>
</main>

<!-- 下钻抽屉 -->
<div class="drawer-mask" id="mask"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div class="drawer-title" id="drawerTitle">明细</div>
    <button class="icon-btn" id="drawerClose">×</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot" hidden></div>
</aside>

<script type="module">
import {
  getMe, apiGet, renderUserArea, renderError,
  escapeHtml, fmtDate, typeLabel,
} from '/common.js';

const $ = (id) => document.getElementById(id);

const PALETTE = ['#2f6fed', '#3aa17e', '#d9a33c', '#cf6b4b', '#8b7ec8', '#9aa6b2'];
const CHART_H = 240;

const state = {
  report: null,
  screen: 3,
  seenUrls: [],
  seenTopics: [],
  userSwitched: false,
};

init();

async function init() {
  const me = await getMe();
  renderUserArea($('userArea'), me);

  if (!me.loggedIn) {
    // 直达 /app 但未登录：回到品牌首页，由首页引导登录
    location.href = '/';
    return;
  }

  // 屏零：登录后自动扫描
  $('scanning').hidden = false;
  animateCount();

  try {
    // 先 L1 速览（1 次请求）快速出结果，再后台补 L2 深挖
    const pre = await apiGet('/api/preview');
    state.report = pre.report;
    showReport();
    deepen();
  } catch (err) {
    $('scanning').hidden = true;
    $('report').hidden = false;
    renderError($('todayBox'), err);
  }
}

/** 扫描计数动画：必须"在长"，不能只转圈 */
function animateCount() {
  let n = 0;
  const timer = setInterval(() => {
    if ($('scanning').hidden) { clearInterval(timer); return; }
    n += Math.ceil(Math.random() * 4);
    $('scanCount').textContent = n;
  }, 90);
}

/** L2 深挖：补齐地层剖面与腐坏度 */
async function deepen() {
  try {
    const full = await apiGet('/api/scan');
    state.report = full.report;
    state.seenUrls = [];
    state.seenTopics = [];
    showReport();
  } catch (err) {
    // L2 被熔断关闭或并发受限：保留 L1 速览结果，不报错打断体验
    if (err.code === 'l2_closed' || err.code === 'busy') {
      state.l2Blocked = err.message;
      const note = document.getElementById('coverage');
      if (note) note.textContent += `　·　${err.message}`;
    }
    // 其他错误静默保留 L1
  }
}

function showReport() {
  $('scanning').hidden = true;
  $('report').hidden = false;
  const r = state.report;

  // 空态：不出报告，给诚实的话
  if (r.empty) {
    $('screen3').hidden = false;
    $('todayBox').innerHTML = `<div class="state">
      <strong>没有读取到可分析的收藏</strong>
      接口只返回公开范围内的收藏夹。如果你的收藏夹都是私密的，这里就会是空的。
    </div>`;
    document.querySelectorAll('.screen-dot').forEach((b) => {
      if (b.dataset.screen !== '3') b.disabled = true;
    });
    $('coverage').textContent = r.coverage?.note || '';
    return;
  }

  // 轻量档：关闭屏一
  const lite = r.tier === 'light';
  document.querySelectorAll('.screen-dot').forEach((b) => {
    if (lite && b.dataset.screen === '1') {
      b.disabled = true;
      b.title = '样本量较少或时间跨度不足 90 天，地层剖面会得出荒谬结论，已按设计关闭';
    } else {
      b.disabled = false;
      b.title = '';
    }
  });

  renderStrata(r);
  renderSummary(r);
  renderCards(r);
  renderToday(r.today);

  $('coverage').textContent =
    `${r.coverage?.note || ''}　·　${r.level === 'L1' ? '速览档' : '深挖档'}　·　本次消耗 ${r.requests} 次接口调用`
    + (lite ? '　·　样本较少，已关闭地层剖面' : '');

  // L1 先渲染，L2 深挖回来后保持用户当前所在屏，不强行跳屏
  switchScreen(state.userSwitched ? state.screen : initialScreen());
}

/* ══════ 屏一 · 地层剖面 ══════ */
function renderStrata(r) {
  if (!r.strata || !r.strata.buckets.length) return;
  const { buckets, topics, matrix, mode } = r.strata;

  $('strataMode').textContent =
    mode === 'month' ? '按月分桶（时间跨度不足一年）' : '按季度分桶，纵轴为收藏量';

  const colTotals = buckets.map((_, bi) =>
    topics.reduce((s, _t, ti) => s + matrix[ti][bi], 0)
  );
  const max = Math.max(...colTotals, 1);

  // 纵轴刻度：取 0 / 中 / 最大三档，让"纵轴为收藏量"这句话可验证
  const ticks = [0, Math.round(max / 2), max].filter((v, i, a) => a.indexOf(v) === i);
  $('strataY').innerHTML = ticks.map((v) => `
    <span class="strata-ytick" style="top:${CHART_H - (v / max) * CHART_H}px">${v}</span>
  `).join('');

  const gridLines = ticks
    .filter((v) => v > 0)
    .map((v) => `<div class="strata-grid" style="bottom:${(v / max) * CHART_H}px"></div>`)
    .join('');

  // 桶多时柱子自适应变窄，保证全部塞进一屏不横向滚动
  const dense = buckets.length > 16;
  $('strataChart').classList.toggle('dense', dense);

  $('strataChart').innerHTML = gridLines + buckets.map((b, bi) => {
    const total = colTotals[bi];
    if (!total) {
      // 空季度保留槽位并画虚线 —— 断层的视觉前提就是看得见的空白
      return `<div class="strata-col" title="${escapeHtml(b)} · 无收藏">
                <div class="strata-empty"></div></div>`;
    }
    return `<div class="strata-col">
      ${topics.map((t, ti) => {
        const v = matrix[ti][bi];
        if (!v) return '';
        const h = (v / max) * CHART_H;
        return `<div class="strata-seg" style="height:${h}px;background:${PALETTE[ti % 6]}"
                     title="${escapeHtml(b)} · ${escapeHtml(t)} · ${v} 条"
                     data-bucket="${escapeHtml(b)}" data-topic="${escapeHtml(t)}"></div>`;
      }).join('')}
    </div>`;
  }).join('');

  // 横轴标签：桶多时稀疏显示（约每年一个），避免挤成一团
  const step = dense ? (buckets.length > 28 ? 4 : 2) : 1;
  $('strataX').classList.toggle('dense', dense);
  $('strataX').innerHTML = buckets.map((b, i) =>
    `<span>${(i % step === 0 || i === buckets.length - 1) ? escapeHtml(b) : ''}</span>`
  ).join('');

  $('strataLegend').innerHTML = topics.map((t, i) => `
    <div class="legend-item">
      <span class="legend-swatch" style="background:${PALETTE[i % 6]}"></span>
      ${escapeHtml(t)}
    </div>`).join('');

  // 断层标注
  $('faultBox').innerHTML = r.faults?.length
    ? r.faults.map((f) => `<div class="fault-line">
        断层 · 你在 <strong>${escapeHtml(f.topic)}</strong> 上的收藏停在
        ${escapeHtml(f.lastBucket)}，已经 ${f.gapMonths} 个月没有新增
      </div>`).join('')
    : '';

  // 点色块下钻
  $('strataChart').querySelectorAll('.strata-seg').forEach((el) => {
    el.addEventListener('click', () => {
      const { bucket, topic } = el.dataset;
      const list = r.items.filter((it) => {
        const key = mode === 'month'
          ? new Date(it.favTime * 1000).toISOString().slice(0, 7)
          : `${new Date(it.favTime * 1000).getFullYear()}Q${Math.floor(new Date(it.favTime * 1000).getMonth() / 3) + 1}`;
        const t = topics.includes(it.topic) ? it.topic : '其他';
        return key === bucket && t === topic;
      });
      openDrawer(`${bucket} · ${topic}`, list);
    });
  });
}

/* ══════ 屏一 · 分类总结（真实数据）══════ */
function renderSummary(r) {
  const sum = r.topicSummary || [];
  if (!sum.length) { $('summaryList').innerHTML = ''; return; }

  const top = sum.filter((t) => t.topic !== '未分类').slice(0, 3);
  const topText = top.map((t) => `${t.topic}（${t.count} 条）`).join('、');
  $('summaryLead').textContent =
    `跨度 ${r.spanText}，共 ${r.total} 条。你收藏最多的是 ${topText}。`;

  const maxCount = Math.max(...sum.map((t) => t.count), 1);
  const motiveTag = {
    主动检索: ['主动搜的', 'm-active'],
    热点跟收: ['刷到就收', 'm-hot'],
    常规: ['常规收藏', 'm-normal'],
  };

  $('summaryList').innerHTML = sum.map((t, i) => {
    const [mLabel, mClass] = motiveTag[t.dominantMotive] || ['', ''];
    const color = t.topic === '未分类' ? '#9aa6b2' : PALETTE[i % 6];
    const lastText = t.lastMonths >= 1 ? `上次收藏在 ${t.lastMonths} 个月前` : '上个月还在收';
    return `
      <div class="summary-row" data-topic="${escapeHtml(t.topic)}">
        <div class="summary-name">
          <span class="summary-dot" style="background:${color}"></span>
          ${escapeHtml(t.topic)}
        </div>
        <div class="summary-bar-wrap">
          <div class="summary-bar" style="width:${(t.count / maxCount) * 100}%;background:${color}"></div>
        </div>
        <div class="summary-num">${t.count} 条 · ${(t.ratio * 100).toFixed(0)}%</div>
        <div class="summary-meta">
          <span class="mtag ${mClass}">${mLabel}</span>
          <span>${lastText}</span>
          ${t.expiredCount > 0 ? `<span class="mtag m-expired">${t.expiredCount} 条已过时效</span>` : ''}
        </div>
      </div>`;
  }).join('');

  // 点分类行 → 下钻该主题条目
  $('summaryList').querySelectorAll('.summary-row').forEach((el) => {
    el.addEventListener('click', () => {
      const topic = el.dataset.topic;
      const list = r.items.filter((it) => it.topic === topic);
      openDrawer(`${topic}`, list);
    });
  });
}

function renderCards(r) {
  $('cards6').innerHTML = r.cards.map((c) => `
    <div class="dcard ${c.disabled ? 'disabled' : ''}" data-key="${c.key}">
      <div class="dcard-label">${escapeHtml(c.label)}</div>
      <div class="dcard-value">${escapeHtml(String(c.value))}</div>
      <div class="dcard-sub">${escapeHtml(c.sub || '')}</div>
    </div>`).join('');

  $('driftBox').innerHTML = (r.drifts || []).map((d) => `
    <div class="drift-band">
      「${escapeHtml(d.folder)}」${d.total} 条里 ${(d.ratio * 100).toFixed(1)}%
      是 ${escapeHtml(d.topic)} —— 这个夹子名和内容已经不匹配了
    </div>`).join('');

  $('cards6').querySelectorAll('.dcard').forEach((el) => {
    const card = r.cards.find((c) => c.key === el.dataset.key);
    if (!card || card.disabled) return;
    el.addEventListener('click', () => {
      if (card.key === 'authors') {
        openAuthors(card);
        return;
      }
      const set = new Set(card.drill);
      const list = r.items.filter((it) => set.has(it.url));
      const ordered = card.drill
        .map((u) => list.find((it) => it.url === u))
        .filter(Boolean);
      openDrawer(card.label, ordered, card.deletable);
    });
  });
}

function openAuthors(card) {
  const rows = (card.topAuthors || []).map((a) => `
    <div class="drawer-row">
      <div style="min-width:0;flex:1">
        <div class="drawer-row-title">
          ${a.url ? `<a href="${escapeHtml(a.url)}" target="_blank" rel="noopener">${escapeHtml(a.name)}</a>` : escapeHtml(a.name)}
        </div>
        <div class="drawer-row-meta">
          <span>你收藏了 TA ${a.count} 条</span>
          ${a.url ? '<span>点名字进主页</span>' : ''}
        </div>
      </div>
    </div>`).join('');
  $('drawerTitle').textContent = `你收藏最多的 ${card.topAuthors?.length || 0} 位作者`;
  $('drawerBody').innerHTML = rows || '<div class="state">暂无数据</div>';
  $('drawerFoot').hidden = true;
  openMask();
}

/* ══════ 屏三 · 今天读这篇 ══════ */
function renderToday(today) {
  if (!today) {
    $('todayBox').innerHTML = `<div class="today-card" style="text-align:center">
      <div class="today-kicker">今天读这篇</div>
      <h2 style="font-size:20px;margin:0 0 10px">你的收藏夹里没有值得今天读的了</h2>
      <p style="color:var(--sub);margin:0">这是好事。要么都读过了，要么该删的已经标出来了 —— 去屏二看看建议删除清单。</p>
    </div>`;
    return;
  }

  $('todayBox').innerHTML = `
    <div class="today-card">
      <div class="today-kicker">今天读这篇</div>
      <a class="today-title" href="${escapeHtml(today.url)}" target="_blank" rel="noopener">
        ${escapeHtml(today.title)}
      </a>
      <div class="today-meta">
        <span class="tag">${typeLabel(today.contentType)}</span>
        <span class="tag gray">${escapeHtml(today.topic)}</span>
        ${today.author ? `<span>${escapeHtml(today.author)}</span><span class="sep">·</span>` : ''}
        <span>发布于 ${fmtDate(today.publishedAt)}</span>
        <span class="sep">·</span>
        <span>收藏于 ${today.favMonths >= 1 ? today.favMonths + ' 个月前' : '近一个月内'}</span>
      </div>

      <div class="reasons">
        <div class="reasons-head">为什么是这一篇</div>
        <div class="reason-chain">
          ${today.reasons.map((x, i) => `
            <div class="reason">
              <span class="reason-no">0${i + 1}</span>
              <div class="reason-body">
                <div class="reason-kind">${escapeHtml(x.kind)}</div>
                <div class="reason-text">${escapeHtml(x.text)}</div>
              </div>
            </div>`).join('')}
        </div>
      </div>

      <div class="today-actions">
        <a class="btn" href="${escapeHtml(today.url)}" target="_blank" rel="noopener">打开原文</a>
        <button class="btn ghost" id="handoffBtn">交给长文本复活器</button>
        <button class="link-btn" id="swapBtn">换一篇</button>
      </div>
    </div>`;

  $('swapBtn')?.addEventListener('click', swapToday);
  $('handoffBtn')?.addEventListener('click', () => {
    // 交接契约：透传 url / content_type / topic / fav_age_month / reasons
    const c = today.handoff;
    alert(
      '交接契约（下游阅读器接收字段）\n\n' +
      `url: ${c.url}\n` +
      `content_type: ${c.contentType}\n` +
      `topic: ${c.topic}\n` +
      `fav_age_month: ${c.favAgeMonth}\n` +
      `reasons:\n  - ${c.reasons.join('\n  - ')}`
    );
  });
}

/** 换一篇：同主题去重，已推过的降权。从缓存重排，不打接口 */
async function swapToday() {
  const btn = $('swapBtn');
  btn.disabled = true;
  btn.textContent = '重排中…';
  const cur = state.report.today;
  if (cur) {
    state.seenUrls.push(cur.url);
    if (!state.seenTopics.includes(cur.topic)) state.seenTopics.push(cur.topic);
  }
  try {
    const q = new URLSearchParams({
      exclude: state.seenUrls.join(','),
      excludeTopic: state.seenTopics.join(','),
    });
    const path = `/api/today?${q}`;
    const res = await apiGet(path);
    const next = res.today;
    state.report.today = next;
    renderToday(next);
  } catch (err) {
    btn.disabled = false;
    btn.textContent = '换一篇';
  }
}

/* ══════ 下钻抽屉 ══════ */
function openDrawer(title, list, deletable = false) {
  $('drawerTitle').textContent = `${title}（${list.length} 条）`;
  $('drawerBody').innerHTML = list.length
    ? list.map((it, i) => `
      <div class="drawer-row">
        ${deletable ? `<input type="checkbox" data-i="${i}">` : ''}
        <div style="min-width:0">
          <a class="drawer-row-title" href="${escapeHtml(it.url)}"
             target="_blank" rel="noopener">${escapeHtml(it.title || '(无标题)')}</a>
          <div class="drawer-row-meta">
            <span class="tag">${typeLabel(it.contentType)}</span>
            <span>${escapeHtml(it.motive)}</span>
            <span>${escapeHtml(it.topic)}</span>
            <span>收藏于 ${it.favMonths >= 1 ? it.favMonths + ' 个月前' : '近一个月内'}</span>
          </div>
        </div>
      </div>`).join('')
    : '<div class="state">这个区间没有条目</div>';

  if (deletable) {
    $('drawerFoot').hidden = false;
    $('drawerFoot').innerHTML = `
      <span style="font-size:12.5px;color:var(--muted)">
        默认全不选。本产品没有写接口，不会真的删除
      </span>
      <button class="btn" id="delBtn" disabled>删除选中的 0 条</button>`;
    const boxes = $('drawerBody').querySelectorAll('input[type=checkbox]');
    const sync = () => {
      const n = [...boxes].filter((b) => b.checked).length;
      const del = $('delBtn');
      del.textContent = `删除选中的 ${n} 条`;
      del.disabled = n === 0;
    };
    boxes.forEach((b) => b.addEventListener('change', sync));
    $('delBtn').addEventListener('click', () => {
      const n = [...boxes].filter((b) => b.checked).length;
      if (confirm(`确认删除选中的 ${n} 条？\n\n本 Demo 不含任何写接口，此操作只做二次确认演示，不会修改你的知乎数据。`)) {
        alert('已确认。本产品在技术上不具备修改用户数据的能力 —— 全站没有任何写接口。');
      }
    });
  } else {
    $('drawerFoot').hidden = true;
  }
  openMask();
}

function openMask() {
  $('mask').classList.add('open');
  $('drawer').classList.add('open');
}
function closeDrawer() {
  $('mask').classList.remove('open');
  $('drawer').classList.remove('open');
}
$('mask').addEventListener('click', closeDrawer);
$('drawerClose').addEventListener('click', closeDrawer);

function initialScreen() {
  const q = new URLSearchParams(location.search).get('screen');
  const m = /^#screen([123])$/.exec(location.hash);
  const raw = q && /^[123]$/.test(q) ? Number(q) : (m ? Number(m[1]) : state.screen);
  // 轻量档禁用屏一时回退到屏三
  if (raw === 1 && state.report?.tier === 'light') return 3;
  return raw;
}

/* ══════ 屏序切换 ══════ */
function switchScreen(n, fromUser = false) {
  state.screen = n;
  if (fromUser) state.userSwitched = true;
  [1, 2, 3].forEach((i) => { $(`screen${i}`).hidden = i !== n; });
  document.querySelectorAll('.screen-dot').forEach((b) => {
    b.classList.toggle('active', Number(b.dataset.screen) === n);
  });
  if (fromUser && location.hash !== `#screen${n}`) {
    history.replaceState(null, '', `#screen${n}`);
  }
}
document.querySelectorAll('.screen-dot').forEach((b) => {
  b.addEventListener('click', () => switchScreen(Number(b.dataset.screen), true));
});
</script>
</body>
